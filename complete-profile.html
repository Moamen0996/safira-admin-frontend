<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفيرة | تفعيل الحساب وتعيين كلمة المرور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400 mb-2">سفيرة للخدمات اللوجستية</h1>
            <p class="text-slate-400 text-sm">أهلاً بك! يرجى تعيين كلمة المرور الخاصة بحسابك لتفعيل الدخول</p>
        </div>

        <form id="completeProfileForm" onsubmit="handlePasswordSetup(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">كلمة المرور الجديدة</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="******" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white outline-none focus:border-amber-400">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" required minlength="6" placeholder="******" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white outline-none focus:border-amber-400">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">تفعيل الحساب والحفظ</button>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        async function handlePasswordSetup(e) {
            e.preventDefault();
            const pass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();

            if (pass !== confirmPass) {
                alert('كلمتا المرور غير متطابقتين!');
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('username');
            const phone = urlParams.get('phone');
            const type = urlParams.get('type') || 'merchant';

            const endpoint = type === 'courier' ? '/api/couriers' : '/api/merchants';

            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, phone, pass })
                });

               const response = await fetch('/api/complete-profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, phone, password, type })
});
const result = await response.json();
if(result.success) {
    alert('تم التفعيل بنجاح!');
    window.location.href = 'index.html';
} else {
    alert(result.message);
}
            } catch (err) {
                alert('حدث خطأ في الاتصال بالسيرفر');
            }
        }
    </script>
</body>
</html>
